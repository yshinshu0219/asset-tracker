<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>アプリを最新版に更新</title>
<style>
  body { font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; padding: 48px 24px; max-width: 560px; margin: 0 auto; color: #1a1d24; }
  h1 { font-size: 20px; }
  p { line-height: 1.7; }
  .ok { color: #1a9e6b; font-weight: 600; }
  .muted { color: #6b7280; font-size: 13px; }
</style>
</head>
<body>
<h1>アプリを最新版に更新しています…</h1>
<p id="status">ブラウザに残っている古いキャッシュを削除しています。</p>
<p class="muted">登録した口座・取込データ・配当記録は削除されません（キャッシュのみ消去します）。</p>
<script>
  // Clears the offline cache and the service worker that served it, then reopens the app.
  // Only the cached copies of the app files are removed — IndexedDB data is left alone.
  (async () => {
    const status = document.getElementById('status');
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) await r.unregister();
      }
      if ('caches' in window) {
        for (const key of await caches.keys()) await caches.delete(key);
      }
      status.innerHTML = '<span class="ok">更新が完了しました。</span> ダッシュボードを開きます…';
    } catch (e) {
      status.textContent = '更新に失敗しました: ' + e.message;
      return;
    }
    setTimeout(() => location.replace('./?updated=' + Date.now()), 900);
  })();
</script>
</body>
</html>
