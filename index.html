<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>資産管理ダッシュボード</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="theme-color" content="#2f6fed" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">💰 資産管理</div>
    <button id="nav-toggle" class="nav-toggle" aria-label="メニュー">☰ メニュー</button>
    <nav class="nav">
      <button class="nav-item active" data-view="dashboard">ダッシュボード</button>
      <button class="nav-item" data-view="performance">成績</button>
      <button class="nav-item" data-view="import">CSV取込</button>
      <button class="nav-item" data-view="manual">手入力</button>
      <button class="nav-item" data-view="brokers">口座管理</button>
      <button class="nav-item" data-view="history">履歴</button>
      <button class="nav-item" data-view="records">過去の記録</button>
      <button class="nav-item" data-view="dividends">配当</button>
      <button class="nav-item" data-view="prices">株価</button>
      <button class="nav-item" data-view="backup">設定・スマホ</button>
    </nav>
    <button id="install-btn" class="btn btn-primary" style="margin:0 8px 10px;" hidden>📲 アプリとしてインストール</button>
    <div class="sidebar-footer"><span id="storage-note">データはこのPCの asset-tracker/data に保存されます。</span><br /><span id="sync-status"></span><br /><span id="app-version"></span></div>
  </aside>
  <main class="content">
    <section id="view-dashboard" class="view"></section>
    <section id="view-performance" class="view" hidden></section>
    <section id="view-import" class="view" hidden></section>
    <section id="view-manual" class="view" hidden></section>
    <section id="view-brokers" class="view" hidden></section>
    <section id="view-history" class="view" hidden></section>
    <section id="view-records" class="view" hidden></section>
    <section id="view-dividends" class="view" hidden></section>
    <section id="view-prices" class="view" hidden></section>
    <section id="view-backup" class="view" hidden></section>
  </main>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.2.0/encoding.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
